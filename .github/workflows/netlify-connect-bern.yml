name: Deploy to Netlify (connect-bern-chat)

on:
  push:
    branches:
      - claude/wa-start-chat

jobs:
  deploy-to-netlify:
    name: Deploy to Netlify (connect-bern-chat)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Build app
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
        run: npm run build
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@4cbaf4c08f1a7bfa537d6113472ef4424e4eb654 # v3.0.0
        with:
          publish-dir: dist
          deploy-message: 'connect-bern-chat deploy ${{ github.sha }}'
          enable-commit-comment: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          production-deploy: true
          github-deployment-environment: connect-bern-chat
          github-deployment-description: 'Live deployment on each commit to the connect-bern-chat branch'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          # The Netlify API accepts the site's full domain in place of the site ID,
          # so no extra NETLIFY_SITE_ID_* repo secret is needed for this site.
          NETLIFY_SITE_ID: connect-bern-chat.netlify.app
        timeout-minutes: 5
